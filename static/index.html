<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Travel</title>

        <style>
            body {
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                background-color: whitesmoke;
            }
            #back {
                position: absolute;
                top: 15px;
                left: 15px;
                font-size: 14pt;
                color: #222;
                border: 1px solid #222;
                padding: 8px;
                cursor: pointer;
            }
            #back:hover {
                background-color: cornflowerblue;
            }
            #chartdiv {
                width: 100%;
                height: calc(100% - 70px);
                margin-top: 70px;
            }
            #stats {
                position: absolute;
                top: 15px;
                left: 70px;
                font-size: 14pt;
                color: #222;
                border: 1px solid #222;
                padding: 9px;
                text-align: right;
            }
            #stats p {
                display: inline-block;
                margin: 0px 10px;
            }
        </style>
    </head>

    <body>
        <span id="back" onclick="history.back()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
            </svg>
        </span>

        <span id="stats">
            <p id="total-countries"></p>
            <p id="total-states"></p>
            <p id="total-provinces"></p>
        </span>
        
        <div id="chartdiv"></div>

        <script src="lib/amcharts5/index.js"></script>
        <script src="lib/amcharts5/map.js"></script>
        <script src="lib/amcharts5/geodata/worldLow.js"></script>
        <script src="lib/amcharts5/geodata/usaLow.js"></script>
        <script src="lib/amcharts5/geodata/canadaLow.js"></script>
        <script src="lib/amcharts5/themes/Animated.js"></script>
        <script>
            let countriesVisited = ["US", "CA", "LI", "HR", "SI", "IT", "FR", "DE", "ES", "CH", "NL", "IL", "KY", "AT", "IS", "PR"];
            let statesVisited = ["ME", "AZ", "MD", "MO", "VA", "WA", "ND", "MT", "CO", "WY", "SD", "IL", "CA", "LA", "VT", "PA", "NE", "CT", "FL", "MA", "NH", "NJ", "NY", "DC"];
            let provincesVisited = ["ON", "QC"];

            document.getElementById('total-countries').innerHTML = `<b>${countriesVisited.length}</b> Countries/Territories Visited`;
            document.getElementById('total-states').innerHTML = `<b>${statesVisited.length - 1}</b> US States Visited`; // subtract 1 for DC
            document.getElementById('total-provinces').innerHTML = `<b>${provincesVisited.length}</b> Canadian Provinces Visited`;

            am5.ready(() => {
                let root = am5.Root.new("chartdiv");

                root.setThemes([am5themes_Animated.new(root)]);

                // Create the map chart
                // https://www.amcharts.com/docs/v5/charts/map-chart/
                var chart = root.container.children.push(am5map.MapChart.new(root, {
                    panX: "translateX",
                    panY: "translateY",
                    projection: am5map.geoMercator()
                }));


                // Create main polygon series for countries
                // https://www.amcharts.com/docs/v5/charts/map-chart/map-polygon-series/
                var polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
                    geoJSON: am5geodata_worldLow,
                    exclude: ["AQ"]
                }));

                polygonSeries.mapPolygons.template.setAll({
                    tooltipText: "{name}",
                    toggleKey: "active",
                    interactive: true,
                    templateField: "polygonSettings" // bind settings
                });

                polygonSeries.mapPolygons.template.states.create("hover", {
                    fill: root.interfaceColors.get("primaryButtonHover")
                });

                polygonSeries.mapPolygons.template.states.create("active", {
                    fill: root.interfaceColors.get("primaryButtonHover")
                });

                let countriesBeen = [];
                countriesVisited.forEach(code => {
                    countriesBeen.push({
                        id: code,
                        polygonSettings: { fill: am5.color(0x3eb06b) } // green
                    });
                });
                polygonSeries.data.setAll(countriesBeen);

                // ------------------ 🇺🇸 USA STATES ------------------ //
                var polygonSeriesUS = chart.series.push(am5map.MapPolygonSeries.new(root, {
                    geoJSON: am5geodata_usaLow
                }));

                polygonSeriesUS.mapPolygons.template.setAll({
                    tooltipText: "{name}",
                    toggleKey: "active",
                    interactive: true,
                    templateField: "polygonSettings" // bind settings
                });

                polygonSeriesUS.mapPolygons.template.states.create("hover", {
                    fill: root.interfaceColors.get("primaryButtonHover")
                });

                polygonSeriesUS.mapPolygons.template.states.create("active", {
                    fill: root.interfaceColors.get("primaryButtonHover")
                });

                let statesBeen = [];
                statesVisited.forEach(code => {
                    statesBeen.push({
                        id: "US-" + code,
                        polygonSettings: { fill: am5.color(0x3eb06b) } // green
                    });
                });
                polygonSeriesUS.data.setAll(statesBeen);

                // ------------------ 🇨🇦 CANADA PROVINCES ------------------ //
                var polygonSeriesCA = chart.series.push(
                    am5map.MapPolygonSeries.new(root, {
                        geoJSON: am5geodata_canadaLow // this file has the provinces
                    })
                );

                polygonSeriesCA.mapPolygons.template.setAll({
                    tooltipText: "{name}",
                    interactive: true,
                    templateField: "polygonSettings"
                });

                polygonSeriesCA.mapPolygons.template.states.create("hover", {
                    fill: root.interfaceColors.get("primaryButtonHover")
                });

                polygonSeriesCA.mapPolygons.template.states.create("active", {
                    fill: root.interfaceColors.get("primaryButtonHover")
                });

                let provincesBeen = [];
                provincesVisited.forEach(code => {
                    provincesBeen.push({
                        id: "CA-" + code,
                        polygonSettings: { fill: am5.color(0x3eb06b) } // green
                    });
                });
                polygonSeriesCA.data.setAll(provincesBeen);


                // Add zoom control
                var zoomControl = chart.set("zoomControl", am5map.ZoomControl.new(root, {}));
                zoomControl.homeButton.set("visible", true);

                // Set clicking on "water" to zoom out
                chart.chartContainer.get("background").events.on("click", function () {
                    chart.goHome();
                })


                // Make stuff animate on load
                chart.appear(1000, 100);
            });
        </script>
    </body>
</html>
